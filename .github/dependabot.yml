version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "2026.3"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
      - dependency-name: "@eslint/js"
        versions: [">=10.0.0"]
      # v9 renamed the row-model factories and re-shaped ColumnDef, which breaks
      # grid.list.tsx. Held at v8 until the migration lands as its own change.
      - dependency-name: "@tanstack/react-table"
        versions: [">=9.0.0"]
    groups:
      # Majors stay out of the grouped pull requests: a breaking bump bundled with
      # fourteen safe ones reads as routine, which is how react-table v9 landed.
      production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "2026.3"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
