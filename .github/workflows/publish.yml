name: Publish to npm

on:
  workflow_dispatch:

permissions:
  # The version bump is committed and pushed from inside this job.
  contents: write
  # Trusted publishing. pnpm asks GitHub for an OIDC id-token and hands that to
  # npm instead of a secret, and without this permission the request is refused
  # — `ERR_PNPM_ID_TOKEN_GITHUB_WORKFLOW_INCORRECT_PERMISSIONS`, which pnpm
  # reports as `[WARN] Skipped OIDC` and then falls back, so the dispatch fails
  # on the token rather than on the thing that was actually missing.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
          scope: '@viglet'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # VDS70 — `pnpm test` runs the story project in a real browser, so this is
      # part of the gate and not a CI-only convenience. Without it the release
      # depended on the runner happening to have a warm playwright cache: one
      # dispatch reached the export check, the next died at browserType.launch.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The same gate CI runs on every push. A manual dispatch skips the branch
      # protection, so publishing re-runs it rather than trusting it.
      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump to next available version
        run: |
          pnpm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          while npm view "${{ github.event.repository.name }}" versions --json 2>/dev/null | grep -q "\"$VERSION\""; do
            echo "Version $VERSION already exists on npm, bumping again..."
            pnpm version patch --no-git-tag-version
            VERSION=$(node -p "require('./package.json').version")
          done
          echo "Will publish version: $VERSION"

      - name: Commit and push version bump
        run: |
          git add package.json pnpm-lock.yaml
          git commit -m "chore: bump version to $(node -p "require('./package.json').version")"
          git push

      # `pnpm publish` runs prepublishOnly, which rebuilds — the bump above only
      # changed the version, and dist must carry it.
      #
      # No `NODE_AUTH_TOKEN`, and that is the point: with `id-token: write` above
      # this publishes as a trusted publisher, so the registry trusts *this
      # workflow in this repository* rather than a long-lived secret somebody has
      # to rotate. It also means npm attaches a provenance attestation on its
      # own; `--provenance` is not passed because it is not needed.
      #
      # It requires a matching trusted publisher on the npm side, registered
      # against the package with three fields: the organisation `openviglet`, the
      # repository `viglet-design-system`, and this file's name, `publish.yml`.
      # Rename this file and the registry stops recognising the publisher.
      - name: Publish
        run: pnpm publish --access public --no-git-checks
