name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The story project runs every story in a real browser: the accessibility
      # rules this package holds are about focus, contrast and the accessibility
      # tree, none of which jsdom models.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run typecheck

      # Both projects: unit tests in jsdom, and every story checked by axe.
      - name: Test
        run: pnpm test

      # Runs tsc again, but it is the step that proves the published artefact
      # builds — the thing a consumer installing from npm actually gets. It ends
      # with check-dist and check-size, so a size regression fails here rather
      # than in a reviewer's diff (VDS42).
      - name: Build
        run: pnpm run build

      - name: Build the component catalogue
        run: pnpm run build-storybook

      # The catalogue build runs last, so it is what leaves dist in whatever
      # state the job ends in — and it once rewrote every declaration to import
      # through a node_modules path (VDS33). check-dist inside `build` cannot
      # see that, because it has already run by then.
      - name: dist is still publishable after the catalogue build
        run: pnpm run check:dist

      # Same reason, for the other half: the catalogue build rewriting dist
      # would change what a consumer bundles, and `build` measured it before
      # that happened.
      - name: dist still weighs what it did after the catalogue build
        run: pnpm run check:size
