name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The story project runs every story in a real browser: the accessibility
      # rules this package holds are about focus, contrast and the accessibility
      # tree, none of which jsdom models.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run typecheck

      # Both projects: unit tests in jsdom, and every story checked by axe.
      - name: Test
        run: pnpm test

      # Runs tsc again, but it is the step that proves the published artefact
      # builds — the thing a consumer installing from npm actually gets.
      - name: Build
        run: pnpm run build

      - name: Build the component catalogue
        run: pnpm run build-storybook
