# What the component catalogue costs an agent session (VDS136).
#
# Estimated at four characters to a token, the ratio Shio's budgets use, so the two
# products' numbers read the same way. Every ceiling is read by
# scripts/check-catalogue.mjs at the end of the build, against the real catalogue,
# and a raise comes with its argument in the comment above it.
#
# The case for the server, stated so the gate can refuse it when it stops holding:
# a session that needed the page contract used to read the vendored skill's two
# documents, about 5,200 tokens, whether it wanted one component or twenty. The
# plugin now puts the tool list and a short skill in context, and a lookup adds its
# answer only when asked. The gate fails if those two together reach the size of
# the documents they replace, and prints how many worst-case lookups a session
# can make before it has spent as much.

# tools/list, as the server returns it. In context for every turn of every session
# with the plugin on, so it stays two tools with short descriptions. Measured 192.
mcp.toolsList.maxTokens=240

# One find_component answer at the default limit of five, the largest over the
# sample jobs in check-catalogue.mjs. Measured 322.
mcp.findComponent.maxTokens=400

# One read_component answer, the largest over every component in the catalogue.
# Measured 884 (BentoFormHero, whose props are all its own); the median is 103.
mcp.readComponent.maxTokens=1100

# The plugin's skill, which points at the server instead of carrying the contract.
# Measured 461.
skill.pointer.maxTokens=560
